server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le routage de l'appli se fait dans le navigateur : /spotify-callback
    # n'existe pas sur le disque. Sans cette regle, le retour d'authentification
    # Spotify tombe sur un 404 et la connexion echoue silencieusement.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers de dist/assets portent un hash dans leur nom : un contenu
    # different produit un nom different, ils peuvent donc etre caches longtemps.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html, lui, ne doit jamais etre cache : c'est lui qui pointe vers le
    # dernier bundle. Le mettre en cache livrerait l'ancienne version apres un
    # deploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
